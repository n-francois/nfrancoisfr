<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Nicolas François">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  {{alternates}}
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{og_alt}}">
  <meta property="og:locale" content="{{og_locale}}">
  <meta property="og:site_name" content="Nicolas François">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{og_image}}">

  <script type="application/ld+json">
{{jsonld}}
  </script>

  <link rel="icon" type="image/svg+xml" href="/assets/nf/logos/tampon-aplat-jaune.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#F6F4EF">

  <link rel="preload" href="/assets/nf/fonts/HankenGrotesk-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/nf/fonts/FamiljenGrotesk-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/assets/nf/nf-tokens.css">
  <link rel="stylesheet" href="/assets/nf/nf-components.css">
  <link rel="stylesheet" href="/assets/nf/nf-motion.css">
  <link rel="stylesheet" href="/assets/site.css">
  <script defer src="/assets/nf/nf-motion.js"></script>
  <script defer src="/assets/site.js"></script>

  <script async src="https://plausible.io/js/pa-5tqihMZ78mC9gS184054P.js"></script>
  <script>
    window.plausible = window.plausible || function () { (plausible.q = plausible.q || []).push(arguments) }, plausible.init = plausible.init || function (i) { plausible.o = i || {} };
    plausible.init()
  </script>
</head>
<body>
<a class="skip-link" href="#contenu">{{skip}}</a>
<div class="nf-page">
{{nav}}
<main id="contenu">
{{contenu}}
</main>
</div>
{{footer}}
</body>
</html>
